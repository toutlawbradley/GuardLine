name: GuardLine Self-Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  security-events: write
  issues: write
  pull-requests: write

jobs:
  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
            fetch-depth: 0
      - uses: toutlawbradley/GuardLine@v1.2.0
    