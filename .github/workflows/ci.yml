name: GuardLine Security Scan CI

on: 
  push:
    branches: [main]
  
  pull_request:
    branches: [main]

permissions:
  security-events: read
  issues: read
  contents: read
  actions: read
  pull-requests: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest
